<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A2C">
<title>Koran · Cell by Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131A2C; --surface:#1C2540; --raised:#26315A; --line:#36436F;
  --text:#EEF1FA; --muted:#A6AFCB; --gold:#F3B75A;
  --ok:#5BD3A8; --okbg:rgba(91,211,168,.14); --bad:#F47C7C; --badbg:rgba(244,124,124,.14);
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#131A2C; } }
:root[data-theme="dark"]{ --bg:#131A2C; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 40px}
header{text-align:center;padding:28px 0 14px}
.name{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,58px);line-height:1;letter-spacing:-.02em;color:var(--gold);margin:0}
.sub{margin:10px 0 0;color:var(--muted);font-size:17px}
.tagline{margin:10px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.2;color:var(--gold)}
.sub strong{color:var(--text);font-weight:700}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.qcount{color:var(--muted);font-size:17px}
.score{font-weight:700;font-size:22px;white-space:nowrap}
.score b{font-family:var(--display);font-size:30px;color:var(--gold)}
.track{height:6px;background:var(--raised);border-radius:6px;margin-top:10px;overflow:hidden;display:flex;gap:3px}
.track span{flex:1;background:var(--raised);border-radius:3px}
.track span.p1{background:var(--ok)} .track span.p5{background:var(--gold)} .track span.p0{background:var(--bad)} .track span.now{background:var(--text)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px;margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.q{font-size:22px;font-weight:700;line-height:1.38;margin:0 0 16px}
.figure{margin:0 0 16px;text-align:center}
.figure img{max-width:100%;max-height:280px;border-radius:16px;border:1px solid var(--line)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:19px;color:var(--text);background:var(--raised);border:2px solid transparent;border-radius:16px;padding:15px 16px;min-height:60px;cursor:pointer;touch-action:manipulation}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center;font-size:16px;font-weight:700}
.opt.sel{border-color:var(--gold)} .opt.sel .box{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.opt.wrong{border-color:var(--bad);background:var(--badbg);opacity:.75}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:21px;align-items:center}
.hint{color:var(--muted);font-size:16px;margin:-6px 0 12px}

.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:18px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb.try{background:rgba(243,183,90,.12);border:1px solid var(--gold)}
.fb h3{margin:0 0 4px;font-size:20px}
.fb p{margin:4px 0 0}
.fb .ans{font-weight:700}

.btn{display:block;width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:20px;border:0;border-radius:16px;padding:16px;min-height:60px;background:var(--gold);color:#1B1606;cursor:pointer;touch-action:manipulation}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}

.final{text-align:center}
.final .big{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;color:var(--gold);margin:6px 0}
.final .big small{font-size:34px;color:var(--muted)}
.list{list-style:none;padding:0;margin:18px 0 0;text-align:left}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.pt{font-weight:700;white-space:nowrap}
.pt.p1{color:var(--ok)} .pt.p5{color:var(--gold)} .pt.p0{color:var(--bad)}

.report{margin-top:22px}
.report h2{font-family:var(--display);font-size:28px;margin:0 0 12px}
.report h3{font-size:19px;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--raised);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:30px;color:var(--gold);line-height:1.1}
.stat span{color:var(--muted);font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.meter{height:8px;background:var(--raised);border-radius:8px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:700}
.empty{color:var(--muted)}

footer{text-align:center;margin-top:30px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline;cursor:pointer;padding:8px}
.clip{display:block;margin-top:18px;font-size:12px;color:var(--muted);opacity:.8}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .25s ease-out} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="name">Koran</h1>
    <p class="tagline">Cell by Cell — stronger every day</p>
    <p class="sub" style="margin-top:2px;font-size:15px">Unit 1 Exam: Ch. 1–3 + Labs 1–3</p>
  </header>
  <div class="bar" id="bar"></div>
  <main id="main"></main>
  <section class="report card" id="report" hidden></section>
  <footer>
    <button class="link" id="toggleReport" type="button">Progress report</button>
    <span class="clip">@clipAI</span>
  </footer>
</div>
<script>
// Question bank - Unit 1 Exam Review (Ch 1, 2, 3) + Lab Activity #1 + images
// mc / case: option o[0] is the correct one (shuffled when shown)
// tf: a = true/false   sa: a = indexes of correct options
const BANK = [
// ---------- CHAPTER 1 ----------
{t:"Anatomy vs physiology",s:"Chapter 1",y:"mc",q:"Anatomy is the study of…",o:["Body structures and how the parts are arranged and connected","How the body performs its functions","Chemical reactions inside cells","Diseases and how to treat them"],e:"Anatomy = structure (what it is and where it is). Physiology = function (how it works)."},
{t:"Anatomy vs physiology",s:"Chapter 1",y:"tf",q:"Physiology is the study of how living organisms perform their vital functions.",a:true,e:"True. Physiology is about how the body works. Anatomy is about its structure."},
{t:"Anatomy vs physiology",s:"Chapter 1",y:"case",q:"Analyze the case: A student learns in lab where the heart sits in the chest, then in lecture learns how it pumps blood. What did she study in lab and in lecture?",o:["Lab: anatomy. Lecture: physiology","Lab: physiology. Lecture: anatomy","Both were histology","Both were cytology"],e:"Where the heart is = structure = anatomy. How it pumps = function = physiology. The two go together."},

{t:"Cytology vs histology",s:"Chapter 1",y:"mc",q:"Histology is the microscopic study of…",o:["Tissues","Individual cells","Organ systems","Bones and joints"],e:"Histology = tissues. Cytology = cells. Tip: \"cyto\" means cell."},
{t:"Cytology vs histology",s:"Chapter 1",y:"tf",q:"Cytology is the microscopic study of tissues.",a:false,e:"False. Cytology studies individual cells. Histology studies tissues."},

{t:"Areas of anatomy",s:"Chapter 1",y:"mc",q:"Which specialty studies the general form of the body and its superficial markings (like bone markings)?",o:["Surface anatomy","Developmental anatomy","Systemic physiology","Cell physiology"],e:"Surface anatomy looks at the outside shape and markings you can see or feel."},
{t:"Areas of anatomy",s:"Chapter 1",y:"case",q:"Analyze the case: A scientist studies how a baby's body changes in form from conception until it becomes an adult. What is she studying?",o:["Developmental anatomy","Surface anatomy","Histology","Cell physiology"],e:"Developmental anatomy describes changes in form from conception to physical maturity."},

{t:"Areas of physiology",s:"Chapter 1",y:"mc",q:"Systemic physiology studies…",o:["The function of specific organ systems","Chemical processes within and between cells","The outside markings of the body","Changes from conception to maturity"],e:"Systemic = systems. It studies how organ systems (like the nervous system) work."},
{t:"Areas of physiology",s:"Chapter 1",y:"case",q:"Analyze the case: A researcher studies the chemical reactions happening inside and between cells. Which area is this?",o:["Cell physiology","Systemic physiology","Surface anatomy","Developmental anatomy"],e:"Cell physiology studies the chemical processes within and between cells."},

{t:"Levels of organization",s:"Chapter 1",y:"mc",q:"Which order goes from simplest to most complex?",o:["Atoms → molecules → cells → tissues → organs → organ systems → organism","Cells → atoms → molecules → tissues → organs → organism","Molecules → atoms → tissues → cells → organs → organism","Atoms → cells → molecules → organs → tissues → organism"],e:"Small to big: atoms, molecules, cells, tissues, organs, organ systems, organism."},
{t:"Levels of organization",s:"Chapter 1",y:"tf",q:"Veins and arteries are organs because each is made of different tissues.",a:true,e:"True. An organ is made of two or more tissue types working together. Veins and arteries fit that."},
{t:"Levels of organization",s:"Chapter 1",y:"case",q:"Analyze the case: A group of similar cells working together to do one job is found in a sample. What level of organization is it?",o:["Tissue","Organ","Molecule","Organ system"],e:"Similar cells working together = a tissue. Different tissues together = an organ."},

{t:"Organ systems",s:"Chapter 1",y:"mc",q:"How many organ systems are in the human body?",o:["11","9","7","13"],e:"There are 11 organ systems. A&P 1 covers integumentary, skeletal, muscular and nervous."},
{t:"Organ systems",s:"Chapter 1",y:"sa",q:"Select all the functions of the skeletal system.",o:["Provides support","Protects soft tissues","Stores minerals","Forms blood","Generates heat"],a:[0,1,2,3],e:"Skeletal: support, protection, stores minerals, forms blood. Generating heat is a job of the muscular system."},
{t:"Organ systems",s:"Chapter 1",y:"sa",q:"Select all the functions of the muscular system.",o:["Produces movement","Generates heat","Provides protection","Forms blood cells"],a:[0,1,2],e:"Muscular: movement, heat and protection. Blood cells are formed in bone (skeletal system)."},

{t:"Homeostasis",s:"Chapter 1",y:"mc",q:"Keeping a relatively constant internal environment is called…",o:["Homeostasis","Metabolism","Metastasis","Apoptosis"],e:"Homeostasis = keeping the inside of the body stable. All organ systems work together for it."},
{t:"Homeostasis",s:"Chapter 1",y:"tf",q:"Organ systems work independently and do not depend on each other.",a:false,e:"False. All organ systems are interdependent. They work together to keep homeostasis."},

{t:"Intrinsic vs extrinsic regulation",s:"Chapter 1",y:"mc",q:"Extrinsic regulation involves which systems?",o:["Nervous and endocrine","Skeletal and muscular","Integumentary and skeletal","Digestive and urinary"],e:"Extrinsic = nervous and endocrine systems. Intrinsic (autoregulation) = a local response of a cell, tissue or organ."},
{t:"Intrinsic vs extrinsic regulation",s:"Chapter 1",y:"case",q:"Analyze the case: The body needs a very fast, short-term adjustment. Which system handles this kind of regulation?",o:["Nervous system","Endocrine system","Skeletal system","Integumentary system"],e:"Nervous system = short-term, fast. Endocrine system (hormones) = long-term."},
{t:"Intrinsic vs extrinsic regulation",s:"Chapter 1",y:"tf",q:"Intrinsic (autoregulatory) mechanisms are local responses of a cell, tissue or organ to its environment.",a:true,e:"True. Intrinsic = local. Extrinsic = nervous and endocrine systems."},

{t:"Parts of a regulatory mechanism",s:"Chapter 1",y:"mc",q:"Which part of a regulatory mechanism carries out the instructions?",o:["Effector","Receptor","Control center","Stimulus"],e:"Receptor senses → control center decides → effector acts."},
{t:"Parts of a regulatory mechanism",s:"Chapter 1",y:"case",q:"Analyze the case: Skin sensors detect that the body is too hot and send a message to the brain. What are the skin sensors?",o:["Receptors","Effectors","Control centers","Target organs"],e:"Receptors detect the stimulus. The brain is the control center. Sweat glands would be the effectors."},

{t:"Negative vs positive feedback",s:"Chapter 1",y:"sa",q:"Select all the examples of POSITIVE feedback.",o:["Blood clotting","Childbirth (parturition)","Lactation (breastfeeding)","Fever","Body temperature regulation","Blood pressure regulation"],a:[0,1,2,3],e:"Positive feedback: clotting, childbirth, lactation, fever. Temperature, blood pressure and electrolytes are negative feedback."},
{t:"Negative vs positive feedback",s:"Chapter 1",y:"tf",q:"Regulation of blood pressure is an example of positive feedback.",a:false,e:"False. Blood pressure, body temperature and electrolyte levels are negative feedback (they bring things back to normal)."},
{t:"Negative vs positive feedback",s:"Chapter 1",y:"case",q:"Analyze the case: After a cut, more and more clotting factors are made until the bleeding stops. What type of feedback is this?",o:["Positive feedback","Negative feedback","Intrinsic regulation only","No feedback"],e:"The response keeps getting stronger until the job is done. That is positive feedback."},

{t:"Abdominal quadrants",s:"Chapter 1",y:"mc",q:"The appendix is found in which quadrant?",o:["Right lower quadrant (RLQ)","Left lower quadrant (LLQ)","Right upper quadrant (RUQ)","Left upper quadrant (LUQ)"],e:"Appendix = RLQ. That is why appendicitis pain is usually low on the right side."},
{t:"Abdominal quadrants",s:"Chapter 1",y:"case",q:"Analyze the case: A patient has pain under the right ribs after eating fatty food. The doctor suspects the gallbladder. Which quadrant?",o:["Right upper quadrant (RUQ)","Left upper quadrant (LUQ)","Right lower quadrant (RLQ)","Left lower quadrant (LLQ)"],e:"Liver and gallbladder are in the RUQ."},
{t:"Abdominal quadrants",s:"Chapter 1",y:"sa",q:"Select all the main organs in the LEFT upper quadrant (LUQ).",o:["Spleen","Portion of the stomach","Portions of small and large intestine","Liver","Appendix"],a:[0,1,2],e:"LUQ: part of the stomach, spleen, parts of the intestines. Liver = RUQ, appendix = RLQ."},

{t:"Abdominal regions",s:"Chapter 1",y:"mc",q:"How many abdominopelvic regions are there?",o:["9","4","6","12"],e:"4 quadrants, but 9 regions (like a tic-tac-toe grid)."},
{t:"Abdominal regions",s:"Chapter 1",y:"mc",q:"Which region is right in the center, around the belly button?",o:["Umbilical","Epigastric","Hypogastric (pubic)","Lumbar"],e:"Umbilical = belly button. Epigastric is above it. Hypogastric (pubic) is below it."},
{t:"Abdominal regions",s:"Chapter 1",y:"case",q:"Analyze the case: A patient points to the area just below the ribs on the right side. Which region is that?",o:["Right hypochondriac","Right inguinal (iliac)","Right lumbar","Epigastric"],e:"Hypochondriac = under the ribs (\"hypo\" = below, \"chondro\" = cartilage of the ribs)."},

{t:"Directional terms",s:"Chapter 1",y:"mc",q:"Proximal means…",o:["Closer to the main attachment point","Farther from the main attachment point","Closer to the surface","Closer to the midline"],e:"Proximal = closer to where the limb attaches. Distal = farther away."},
{t:"Directional terms",s:"Chapter 1",y:"case",q:"Analyze the case: Compare the elbow and the wrist. The elbow is ______ to the wrist.",o:["Proximal","Distal","Lateral","Deep"],e:"The elbow is closer to the shoulder (the attachment), so it is proximal to the wrist."},
{t:"Directional terms",s:"Chapter 1",y:"tf",q:"Lateral means closer to the midline of the body.",a:false,e:"False. Lateral = away from the midline. Medial = closer to the midline."},
{t:"Directional terms",s:"Chapter 1",y:"mc",q:"The skin is ______ to the muscles.",o:["Superficial","Deep","Proximal","Caudal"],e:"Superficial = close to the surface. Deep = farther from the surface."},

{t:"Planes of section",s:"Chapter 1",y:"mc",q:"Which plane divides the body into right and left portions?",o:["Sagittal","Coronal (frontal)","Transverse","Oblique"],e:"Sagittal = right/left. Coronal = front/back. Transverse = top/bottom."},
{t:"Planes of section",s:"Chapter 1",y:"case",q:"Analyze the case: A CT scan shows \"slices\" of the abdomen that separate the upper part from the lower part. Which plane?",o:["Transverse (horizontal/axial)","Sagittal","Coronal (frontal)","Midsagittal only"],e:"Transverse divides superior (top) from inferior (bottom). CT slices are usually transverse."},
{t:"Planes of section",s:"Chapter 1",y:"tf",q:"The coronal (frontal) plane divides the body into anterior and posterior portions.",a:true,e:"True. Coronal = front (anterior) and back (posterior)."},

{t:"Diaphragm",s:"Chapter 1",y:"mc",q:"The diaphragm separates which two cavities?",o:["Thoracic and abdominopelvic","Cranial and vertebral","Abdominal and pelvic","Pleural and pericardial"],e:"The diaphragm is the main breathing muscle. It separates the chest (thoracic) from the abdominopelvic cavity."},
{t:"Diaphragm",s:"Chapter 1",y:"tf",q:"The diaphragm is the main muscle of respiration.",a:true,e:"True. When it contracts, air moves into the lungs."},

{t:"Mediastinum",s:"Chapter 1",y:"sa",q:"Select all the organs found in the mediastinum.",o:["Heart","Thymus","Trachea","Esophagus","Lungs","Liver"],a:[0,1,2,3],e:"Mediastinum = center of the chest: heart, thymus, trachea, esophagus. The lungs are on each side, not in the middle."},
{t:"Mediastinum",s:"Chapter 1",y:"mc",q:"The area in the center of the chest is called the…",o:["Mediastinum","Peritoneum","Pleural cavity","Pericardium"],e:"Mediastinum = the middle space of the chest between the lungs."},

{t:"Serous membranes",s:"Chapter 1",y:"mc",q:"Which serous membrane covers the lungs?",o:["Pleura","Pericardium","Peritoneum","Mesentery"],e:"Pleura = lungs. Pericardium = heart. Peritoneum = digestive organs and abdominal wall."},
{t:"Serous membranes",s:"Chapter 1",y:"case",q:"Analyze the case: A patient has inflammation of the membrane that lines the abdominal wall and covers the digestive organs. What is it called?",o:["Peritonitis","Pleuritis","Pericarditis","Ascites"],e:"Peritoneum + \"-itis\" (inflammation) = peritonitis."},
{t:"Serous membranes",s:"Chapter 1",y:"tf",q:"The pericardium covers the heart.",a:true,e:"True. \"Peri\" = around, \"cardium\" = heart."},

{t:"Retroperitoneal organs",s:"Chapter 1",y:"sa",q:"Select all the RETROPERITONEAL organs (SAD PUCKER).",o:["Kidneys","Pancreas (except the tail)","Ureters","Suprarenal (adrenal) glands","Stomach","Spleen"],a:[0,1,2,3],e:"SAD PUCKER: Suprarenal glands, Aorta/IVC, Duodenum, Pancreas, Ureters, Colon (ascending & descending), Kidneys, Esophagus (distal), Rectum."},
{t:"Retroperitoneal organs",s:"Chapter 1",y:"tf",q:"The kidneys are retroperitoneal organs.",a:true,e:"True. Retroperitoneal = behind the peritoneum. The K in SAD PUCKER is Kidneys."},

{t:"Imaging studies",s:"Chapter 1",y:"mc",q:"What is the gold standard test to detect a deep vein thrombosis (DVT) in the legs?",o:["Duplex ultrasonography","PET scan","X-ray without contrast","Nuclear scan"],e:"Duplex ultrasound uses high-frequency sound waves to see blood flow. It is the gold standard for DVT."},
{t:"Imaging studies",s:"Chapter 1",y:"sa",q:"Select all the imaging studies that use ionizing radiation.",o:["X-ray","CT scan","Digital subtraction angiography (DSA)","Ultrasound","MRI"],a:[0,1,2],e:"X-ray, CT and DSA use ionizing radiation. Ultrasound uses sound waves. MRI uses a magnet and radio waves."},
{t:"Imaging studies",s:"Chapter 1",y:"case",q:"Analyze the case: A doctor wants to see how active (metabolic activity) a tissue is, using a radioactive tracer. Which test?",o:["PET scan","MRI","Ultrasound","X-ray"],e:"PET scan = radioactive tracer + shows metabolic activity."},
{t:"Imaging studies",s:"Chapter 1",y:"mc",q:"Which test uses a strong magnetic field and radiofrequency pulses to see soft tissues in high resolution?",o:["MRI","CT scan","X-ray","DSA"],e:"MRI = magnet + radio waves. Very detailed pictures of soft tissues."},

// ---------- LAB ACTIVITY #1 ----------
{t:"Body positions",s:"Lab 1",y:"mc",q:"A patient lying face UP is in which position?",o:["Supine","Prone","Sims","Tripod"],e:"Supine = face up (lying on the spine). Prone = face down."},
{t:"Body positions",s:"Lab 1",y:"mc",q:"A patient lying face DOWN is in which position?",o:["Prone","Supine","Fowler","Trendelenburg"],e:"Prone = face down. Supine = face up."},
{t:"Body positions",s:"Lab 1",y:"case",q:"Analyze the case: A patient lies on the bed with the head LOWER than the feet (decline). Which position?",o:["Trendelenburg","Fowler","Supine","Tripod"],e:"Trendelenburg = decline, head down. Fowler = incline, sitting up."},
{t:"Body positions",s:"Lab 1",y:"case",q:"Analyze the case: A patient sits up in bed with the head raised (incline), which helps breathing and lowers the risk of aspiration. Which position?",o:["Fowler","Trendelenburg","Prone","Sims"],e:"Fowler = incline, head up. It helps breathing and eating safely."},
{t:"Body positions",s:"Lab 1",y:"mc",q:"The left lateral recumbent position is also called…",o:["Sims position","Fowler position","Tripod position","Anatomical position"],e:"Sims = lying on the LEFT side."},

{t:"Surface regions 1",s:"Lab 1",y:"mc",q:"The front of the elbow is the ______ region.",o:["Antecubital","Popliteal","Axillary","Patellar"],e:"Antecubital = front of the elbow (where blood is often drawn)."},
{t:"Surface regions 1",s:"Lab 1",y:"mc",q:"The back of the knee is the ______ region.",o:["Popliteal","Patellar","Calcaneal","Femoral"],e:"Popliteal = back of the knee. Patellar = front of the knee."},
{t:"Surface regions 1",s:"Lab 1",y:"tf",q:"The axillary region is the armpit.",a:true,e:"True. Axillary = armpit."},

{t:"Surface regions 2",s:"Lab 1",y:"mc",q:"The cheek is the ______ region.",o:["Buccal","Mental","Frontal","Cervical"],e:"Buccal = cheek. Mental = chin. Frontal = forehead. Cervical = neck."},
{t:"Surface regions 2",s:"Lab 1",y:"mc",q:"The chin is the ______ region.",o:["Mental","Buccal","Acromial","Coxal"],e:"Mental = chin (not \"mind\" here!)."},
{t:"Surface regions 2",s:"Lab 1",y:"sa",q:"Select all the correct matches.",o:["Coxal = hip","Calcaneal = heel","Inguinal = groin","Acromial = knee","Brachial = thigh"],a:[0,1,2],e:"Acromial = shoulder. Brachial = arm. Femoral = thigh."},

{t:"Serous membrane conditions",s:"Lab 1",y:"case",q:"Analyze the case: A patient has muffled heart sounds, swollen neck veins (JVD) and low blood pressure (Beck's triad). What is happening?",o:["Cardiac tamponade","Pneumothorax","Ascites","Pleuritis"],e:"Beck's triad = cardiac tamponade: fluid squeezes the heart inside the pericardium."},
{t:"Serous membrane conditions",s:"Lab 1",y:"mc",q:"Air in the pleural cavity that makes a lung collapse is called…",o:["Pneumothorax","Pleural effusion","Ascites","Pericarditis"],e:"\"Pneumo\" = air, \"thorax\" = chest. Pleural effusion is fluid, not air."},
{t:"Serous membrane conditions",s:"Lab 1",y:"mc",q:"Mesenteries are…",o:["Double sheets of peritoneum that attach intestines to the back body wall","Layers of pleura around the lungs","Membranes that cover the heart","Fluid in the abdominal cavity"],e:"Mesenteries hold the intestines in place and carry blood vessels and nerves to them."},

// ---------- CHAPTER 2 ----------
{t:"Isotopes",s:"Chapter 2",y:"mc",q:"Isotopes of the same element differ in the number of…",o:["Neutrons","Protons","Electrons","Valence shells"],e:"Same element = same protons. Isotopes have different numbers of neutrons."},
{t:"Isotopes",s:"Chapter 2",y:"tf",q:"Isotopes of an element have different numbers of protons.",a:false,e:"False. If protons changed, it would be a different element. Isotopes differ in neutrons."},

{t:"Ionic bonds",s:"Chapter 2",y:"mc",q:"In an ionic bond, electrons are…",o:["Transferred from one atom to another","Shared equally","Shared unequally","Destroyed"],e:"Ionic = electrons are transferred. Covalent = electrons are shared."},
{t:"Ionic bonds",s:"Chapter 2",y:"mc",q:"An atom that loses an electron and becomes positively charged is a(n)…",o:["Cation","Anion","Isotope","Neutron"],e:"Cation = positive. Anion = negative. Tip: ca+ion has a \"+\" like a t."},
{t:"Ionic bonds",s:"Chapter 2",y:"tf",q:"Losing electrons is called oxidation.",a:true,e:"True. Loss = oxidation. Gain = reduction."},

{t:"Ions",s:"Chapter 2",y:"mc",q:"An ion is an atom or molecule that…",o:["Has a different number of electrons than protons, so it has a charge","Has extra neutrons","Has no electrons","Shares electrons equally"],e:"More or fewer electrons than protons = a net positive or negative charge = an ion."},

{t:"Hydrogen bonds",s:"Chapter 2",y:"mc",q:"Which type of bond is responsible for the surface tension of water?",o:["Hydrogen bonds","Ionic bonds","Nonpolar covalent bonds","Peptide bonds"],e:"Hydrogen bonds between water molecules make surface tension. That is why a dust particle can float."},
{t:"Hydrogen bonds",s:"Chapter 2",y:"case",q:"Analyze the case: A tiny dust particle floats on top of a glass of water without sinking. What explains this?",o:["Hydrogen bonding causes surface tension","Ionic bonds in the dust","The water is basic","Electrons were transferred to the dust"],e:"Hydrogen bonds make the water surface act like a thin film (surface tension)."},
{t:"Hydrogen bonds",s:"Chapter 2",y:"tf",q:"Hydrogen bonding is responsible for the secondary structure of proteins (alpha helix and beta pleated sheet).",a:true,e:"True. Hydrogen bonds form the alpha (α) helix and beta (β) pleated sheet."},

{t:"Valence electrons",s:"Chapter 2",y:"mc",q:"What determines the chemical behavior of an atom?",o:["Its outermost (valence) electrons","Its number of neutrons","The size of its nucleus","Its isotopes"],e:"Valence electrons (the outer shell) decide how an atom reacts and bonds."},

{t:"Covalent bonds",s:"Chapter 2",y:"mc",q:"In a double covalent bond, how many pairs of electrons are shared?",o:["Two pairs","One pair","Three pairs","None"],e:"Single = 1 pair. Double = 2 pairs. Triple = 3 pairs."},
{t:"Covalent bonds",s:"Chapter 2",y:"mc",q:"In a POLAR covalent bond, electrons are…",o:["Shared unequally","Shared equally","Transferred","Lost"],e:"Polar = unequal sharing. Nonpolar = equal sharing."},
{t:"Covalent bonds",s:"Chapter 2",y:"tf",q:"Covalent bonds form when atoms share electrons.",a:true,e:"True. Covalent = sharing. Ionic = transferring."},

{t:"Types of reactions",s:"Chapter 2",y:"mc",q:"AB → A + B is which type of reaction?",o:["Decomposition","Synthesis","Exchange","Endergonic"],e:"Something big breaks into smaller parts = decomposition."},
{t:"Types of reactions",s:"Chapter 2",y:"mc",q:"AB + CD → AD + BC is which type of reaction?",o:["Exchange","Synthesis","Decomposition","Hydrolysis"],e:"Partners switch places = exchange."},
{t:"Types of reactions",s:"Chapter 2",y:"case",q:"Analyze the case: Two molecules join into one and a water molecule is removed. What type of reaction?",o:["Dehydration synthesis","Hydrolysis","Exchange","Decomposition without water"],e:"Joining + removing water = dehydration synthesis. Breaking + adding water = hydrolysis."},
{t:"Types of reactions",s:"Chapter 2",y:"mc",q:"A + B → AB + Energy is which type of reaction?",o:["Exergonic","Endergonic","Decomposition","Exchange"],e:"Exergonic RELEASES energy (\"exit\"). Endergonic needs energy put in."},

{t:"Enzymes",s:"Chapter 2",y:"sa",q:"Select all the TRUE statements about enzymes.",o:["They are proteins","They lower the activation energy","They are affected by pH and temperature","They are not consumed in the reaction","They slow reactions down"],a:[0,1,2,3],e:"Enzymes are protein catalysts: they SPEED UP reactions by lowering activation energy and can be reused."},
{t:"Enzymes",s:"Chapter 2",y:"tf",q:"Enzymes are used up (consumed) during a reaction.",a:false,e:"False. Enzymes are not changed or consumed. They can be used again."},

{t:"Electrolytes",s:"Chapter 2",y:"mc",q:"Electrolytes like NaCl are inorganic compounds that…",o:["Carry an electrical current in water","Store genetic information","Are the main fuel of the body","Form cell membranes"],e:"Electrolytes break into ions in water, so they can carry electricity."},

{t:"Acids and bases",s:"Chapter 2",y:"mc",q:"An acid is a substance that…",o:["Releases hydrogen ions (proton donor)","Removes hydrogen ions (proton acceptor)","Has a pH above 7","Has no charge"],e:"Acid = gives H+. Base = takes H+."},
{t:"Acids and bases",s:"Chapter 2",y:"tf",q:"A base is a proton acceptor that removes hydrogen ions.",a:true,e:"True. Base = takes (accepts) H+."},

{t:"pH scale",s:"Chapter 2",y:"mc",q:"A solution has a pH of 3. It is…",o:["Acidic","Neutral","Basic (alkaline)","A buffer"],e:"Below 7 = acidic. 7 = neutral. Above 7 = basic."},
{t:"pH scale",s:"Chapter 2",y:"case",q:"Analyze the case: Solution A has MORE hydrogen ions (H+) than solution B. Which is true?",o:["A has a lower pH and is more acidic","A has a higher pH and is more basic","Both have the same pH","A is neutral"],e:"More H+ = lower pH = more acidic. pH goes the opposite way of H+."},
{t:"pH scale",s:"Chapter 2",y:"tf",q:"A pH above 7 means the solution has more OH- and less H+.",a:true,e:"True. Above 7 = basic (alkaline) = more OH-."},

{t:"Glucose and glycogen",s:"Chapter 2",y:"mc",q:"What is the most important metabolic fuel in the body?",o:["Glucose","Cholesterol","Protein","DNA"],e:"Glucose is the body's main fuel."},
{t:"Glucose and glycogen",s:"Chapter 2",y:"case",q:"Analyze the case: Between meals, the liver breaks down stored glycogen to keep blood glucose normal. What is this process called?",o:["Glycogenolysis","Glycogenesis","Hydrolysis of DNA","Beta oxidation"],e:"\"-lysis\" = break down. Glycogenesis = MAKING glycogen (after a meal)."},
{t:"Glucose and glycogen",s:"Chapter 2",y:"mc",q:"Where is glycogen formed?",o:["Liver and skeletal muscle","Brain and heart","Kidneys and lungs","Skin and bone"],e:"Glycogen is a polysaccharide stored in the liver and skeletal muscle."},

{t:"Fatty acids",s:"Chapter 2",y:"mc",q:"Saturated fatty acids have…",o:["Only single bonds between carbon atoms","One double bond","Many double bonds","Triple bonds only"],e:"Saturated = only single bonds. Unsaturated = at least one double (or triple) bond. Polyunsaturated = more than one."},
{t:"Fatty acids",s:"Chapter 2",y:"tf",q:"Polyunsaturated fatty acids have more than one double or triple bond.",a:true,e:"True. \"Poly\" = many."},

{t:"Steroids",s:"Chapter 2",y:"mc",q:"Cholesterol is needed to make…",o:["Sex hormones (estrogen, testosterone) and plasma membranes","DNA and RNA","Glycogen","Enzymes"],e:"Cholesterol builds sex hormones and is part of cell membranes."},
{t:"Steroids",s:"Chapter 2",y:"case",q:"Analyze the case: A female marathon runner has very low cholesterol and has trouble getting pregnant. Why?",o:["Low cholesterol can lower sex hormones and affect fertility","Low cholesterol raises her pH","She has too much glycogen","Her DNA cannot replicate"],e:"Sex hormones are made from cholesterol. Too little can affect fertility."},

{t:"Glycoproteins and proteoglycans",s:"Chapter 2",y:"mc",q:"Glycoproteins are mainly…",o:["Structural parts of cell membranes","Parts of the extracellular matrix of connective tissue","Enzymes that copy DNA","Stored fuel"],e:"Glycoproteins = cell membranes. Proteoglycans = extracellular matrix of connective tissue. Both = protein + carbohydrate."},

{t:"DNA structure",s:"Chapter 2",y:"sa",q:"Select all the TRUE statements about DNA.",o:["It is double stranded (double helix)","The strands are complementary","The strands are antiparallel","It is replicated in the nucleus by DNA polymerase","It contains uracil"],a:[0,1,2,3],e:"DNA has thymine, not uracil. Uracil is in RNA."},
{t:"DNA structure",s:"Chapter 2",y:"mc",q:"Nucleotides are the building blocks of…",o:["Nucleic acids (DNA and RNA)","Proteins","Carbohydrates","Lipids"],e:"Nucleotides build nucleic acids, which store and process genetic information."},

{t:"Base pairing",s:"Chapter 2",y:"mc",q:"The DNA template is CTA. What is the complementary DNA strand?",o:["GAT","GAU","CTA","TAG"],e:"In DNA: C pairs with G, T with A, A with T. So CTA → GAT."},
{t:"Base pairing",s:"Chapter 2",y:"mc",q:"The DNA template is CTA. What is the complementary RNA?",o:["GAU","GAT","CUA","TAC"],e:"In RNA, A pairs with U (uracil), not T. So CTA → GAU."},
{t:"Base pairing",s:"Chapter 2",y:"mc",q:"The DNA template is TAC. What is the complementary RNA?",o:["AUG","ATG","UAC","GUA"],e:"T→A, A→U, C→G. So TAC → AUG (the start codon!)."},

{t:"Purines and pyrimidines",s:"Chapter 2",y:"mc",q:"Which bases are purines?",o:["Adenine and guanine","Cytosine and thymine","Thymine and uracil","Cytosine and uracil"],e:"Purines: A and G. Pyrimidines: C, T and U. A purine always pairs with a pyrimidine."},
{t:"Purines and pyrimidines",s:"Chapter 2",y:"tf",q:"Adenine pairs with uracil in RNA.",a:true,e:"True. A-T in DNA, A-U in RNA. G always pairs with C."},

{t:"Transcription",s:"Chapter 2",y:"mc",q:"Before mRNA leaves the nucleus, which parts are removed?",o:["Introns (non-coding)","Exons (coding)","Codons","Anticodons"],e:"Introns are removed. Exons stay (\"EXons EXit\")."},
{t:"Transcription",s:"Chapter 2",y:"tf",q:"Transcription (RNA synthesis) takes place in the nucleus and uses RNA polymerase.",a:true,e:"True. Transcription = nucleus. Translation = cytoplasm."},

{t:"Translation",s:"Chapter 2",y:"sa",q:"Select all the STOP codons.",o:["UGA","UAG","UAA","AUG"],a:[0,1,2],e:"U Go Away, U Are Gone, U Are Annihilated. AUG is the START codon (methionine)."},
{t:"Translation",s:"Chapter 2",y:"mc",q:"The first codon, AUG, codes for which amino acid?",o:["Methionine","Glycine","Uracil","Alanine"],e:"AUG = start codon = methionine."},
{t:"Translation",s:"Chapter 2",y:"case",q:"Analyze the case: A ribosome in the cytoplasm reads mRNA and tRNAs bring amino acids. What process is this?",o:["Translation (protein synthesis)","Transcription","DNA replication","Glycogenesis"],e:"Translation happens in the cytoplasm with ribosomes, mRNA and tRNA. Codons are on mRNA, anticodons on tRNA."},

{t:"ATP",s:"Chapter 2",y:"mc",q:"What is the most abundant free high-energy compound in cells?",o:["ATP (adenosine triphosphate)","Glucose","DNA","Cholesterol"],e:"ATP is the cell's ready-to-use energy \"money\"."},

// ---------- CHAPTER 3 ----------
{t:"Plasma membrane",s:"Chapter 3",y:"mc",q:"Plasma membranes are selectively permeable. This means…",o:["They let some substances pass but not others","They let everything pass","They let nothing pass","They only let water pass"],e:"Selectively permeable = the membrane chooses what goes in and out."},
{t:"Plasma membrane",s:"Chapter 3",y:"sa",q:"Select all the functions of the plasma membrane.",o:["Acts as a barrier","Provides structural support","Regulates exchange with the outside","Is sensitive to chemical changes outside the cell","Makes ATP"],a:[0,1,2,3],e:"ATP is made mainly by the mitochondria, not the membrane."},

{t:"Mitochondria and lysosomes",s:"Chapter 3",y:"mc",q:"Which organelle makes about 95% of ATP when oxygen is present?",o:["Mitochondria","Golgi apparatus","Lysosome","Nucleolus"],e:"Mitochondria = the powerhouse of the cell."},
{t:"Mitochondria and lysosomes",s:"Chapter 3",y:"mc",q:"Which organelle digests materials inside the cell?",o:["Lysosome","Ribosome","Smooth ER","Centriole"],e:"Lysosomes digest (break down) materials."},

{t:"Golgi and ER",s:"Chapter 3",y:"mc",q:"Which organelle makes lysosomes, secretory vesicles and membrane renewal vesicles?",o:["Golgi apparatus","Smooth ER","Nucleus","Mitochondria"],e:"The Golgi packages and ships: lysosomes, secretory vesicles and membrane renewal vesicles."},
{t:"Golgi and ER",s:"Chapter 3",y:"mc",q:"Carbohydrates and lipids are made by the…",o:["Smooth ER","Ribosomes","Lysosomes","Centrioles"],e:"Smooth ER makes lipids and carbohydrates. Ribosomes make proteins."},

{t:"Peroxisomes",s:"Chapter 3",y:"mc",q:"Peroxisomes break down long-chain fatty acids through…",o:["Beta oxidation","Glycolysis","Transcription","Endocytosis"],e:"Peroxisomes do beta oxidation. It makes hydrogen peroxide, which catalase turns into water and oxygen."},
{t:"Peroxisomes",s:"Chapter 3",y:"case",q:"Analyze the case: Hydrogen peroxide builds up inside a peroxisome. Which enzyme breaks it into water and oxygen?",o:["Catalase","DNA polymerase","RNA polymerase","Amylase"],e:"Catalase breaks down hydrogen peroxide into water + oxygen."},

{t:"Cytoskeleton and centrioles",s:"Chapter 3",y:"mc",q:"Microfilaments are made of…",o:["Actin","Tubulin","Cholesterol","Glycogen"],e:"Microfilaments = actin. Microtubules = tubulin."},
{t:"Cytoskeleton and centrioles",s:"Chapter 3",y:"mc",q:"Which structures align and separate sister chromatids during mitosis?",o:["Centrioles","Lysosomes","Peroxisomes","Smooth ER"],e:"Centrioles help line up and pull apart the chromatids when a cell divides."},

{t:"Nucleus and nucleolus",s:"Chapter 3",y:"mc",q:"Where are ribosomes made?",o:["Nucleolus","Golgi apparatus","Mitochondria","Cytoplasm"],e:"The nucleolus (inside the nucleus) makes ribosomes. It appears and disappears during the cell cycle."},
{t:"Nucleus and nucleolus",s:"Chapter 3",y:"tf",q:"The nucleus controls all the functions of the cell and contains DNA.",a:true,e:"True. The nucleus is the control center and holds the DNA."},

{t:"Cell cycle",s:"Chapter 3",y:"mc",q:"During which phase is DNA replicated?",o:["S phase of interphase","Prophase","Anaphase","Telophase"],e:"S = synthesis. DNA is copied in the S phase of interphase."},
{t:"Cell cycle",s:"Chapter 3",y:"tf",q:"Cells spend most of their time in interphase, the nondividing phase.",a:true,e:"True. Most of a cell's life is interphase."},
{t:"Cell cycle",s:"Chapter 3",y:"case",q:"Analyze the case: Under the microscope you see sister chromatids clearly and the nuclear membrane is breaking down. Which phase?",o:["Prophase","Interphase","Telophase","S phase"],e:"In prophase DNA coils tightly (chromatids visible) and the nuclear membrane breaks down."},
{t:"Cell cycle",s:"Chapter 3",y:"mc",q:"Spindle fibers attach to the ______, a protein near the centromere.",o:["Kinetochore","Histone","Chromatin","Telomere"],e:"Kinetochore = the attachment point for spindle fibers."},

{t:"Mitosis",s:"Chapter 3",y:"mc",q:"After mitosis, each daughter cell has…",o:["The same number of chromosomes as the parent (46)","Half the chromosomes (23)","Twice the chromosomes (92)","No chromosomes"],e:"Mitosis makes 2 identical cells, each with 46 chromosomes."},
{t:"Mitosis",s:"Chapter 3",y:"mc",q:"Sex cells have 23 chromosomes. They are called…",o:["Haploid","Diploid","Homologous","Isotonic"],e:"Haploid = 23 (half). Diploid = 46."},
{t:"Mitosis",s:"Chapter 3",y:"sa",q:"Select all the phases of mitosis.",o:["Prophase","Metaphase","Anaphase","Telophase","S phase"],a:[0,1,2,3],e:"PMAT: prophase, metaphase, anaphase, telophase. S phase is part of interphase."},

{t:"Tonicity (image)",s:"Chapter 3",y:"case",img:"t2",q:"Analyze the image: This red blood cell lost water and shriveled. What kind of solution is it in?",o:["Hypertonic","Hypotonic","Isotonic","Neutral pH"],e:"Hypertonic solution pulls water OUT of the cell, so it shrinks (crenation)."},
{t:"Tonicity (image)",s:"Chapter 3",y:"case",img:"t0",q:"Analyze the image: This red blood cell took in water and swelled up. What kind of solution is it in?",o:["Hypotonic","Hypertonic","Isotonic","Acidic"],e:"Hypotonic solution pushes water INTO the cell, so it swells and can burst (hemolysis)."},
{t:"Tonicity (image)",s:"Chapter 3",y:"case",img:"t1",q:"Analyze the image: Water goes in and out equally and the cell keeps its normal shape. What kind of solution is it in?",o:["Isotonic","Hypotonic","Hypertonic","Basic"],e:"Isotonic = no net water movement, no change in shape."},

{t:"Tonicity",s:"Chapter 3",y:"case",q:"Analyze the case: A dehydrated patient needs IV fluids that will NOT change the shape of the blood cells. What should be given?",o:["Isotonic (physiologic) saline","Hypertonic saline","Pure water (hypotonic)","An acidic solution"],e:"Isotonic saline keeps cells normal. That is what is given IV for dehydration."},
{t:"Tonicity",s:"Chapter 3",y:"tf",q:"A red blood cell placed in a hypertonic solution undergoes crenation (shrinks).",a:true,e:"True. Hypertonic = cell shrinks (crenation). Hypotonic = cell swells (hemolysis)."},

{t:"Facilitated diffusion",s:"Chapter 3",y:"mc",q:"Glucose is too big for channels, so it crosses the membrane using carrier proteins, from high to low concentration. This is…",o:["Facilitated diffusion","Active transport","Endocytosis","Osmosis"],e:"Facilitated diffusion = carrier protein, high → low, no ATP."},
{t:"Facilitated diffusion",s:"Chapter 3",y:"tf",q:"Facilitated diffusion requires ATP.",a:false,e:"False. It moves things down the gradient (high → low), so it is passive, no ATP."},

{t:"Passive vs active transport",s:"Chapter 3",y:"sa",q:"Select all the PASSIVE processes (no energy needed).",o:["Simple diffusion","Facilitated diffusion","Osmosis","Active transport","Vesicular transport"],a:[0,1,2],e:"Active transport and vesicular transport need energy (ATP)."},
{t:"Passive vs active transport",s:"Chapter 3",y:"mc",q:"Which transport process requires energy?",o:["Vesicular transport","Osmosis","Simple diffusion","Facilitated diffusion"],e:"Active and vesicular transport require energy. Diffusion and osmosis don't."},

{t:"Endocytosis and exocytosis",s:"Chapter 3",y:"mc",q:"Taking materials INTO the cell using vesicles is…",o:["Endocytosis","Exocytosis","Osmosis","Apoptosis"],e:"Endo = in. Exo = out."},
{t:"Endocytosis and exocytosis",s:"Chapter 3",y:"case",q:"Analyze the case: A cell packs its waste into a vesicle and releases it outside. What process is this?",o:["Exocytosis","Endocytosis","Facilitated diffusion","Autolysis"],e:"Exo = exit. Exocytosis moves materials out of the cell."},

{t:"Sodium-potassium pump",s:"Chapter 3",y:"mc",q:"The sodium-potassium pump moves…",o:["3 Na+ out and 2 K+ in","2 Na+ out and 3 K+ in","3 K+ out and 2 Na+ in","Na+ and K+ both in"],e:"3 sodium OUT, 2 potassium IN, using ATP."},
{t:"Sodium-potassium pump",s:"Chapter 3",y:"tf",q:"The sodium-potassium pump is primary active transport because it moves ions against their gradient using energy.",a:true,e:"True. Low → high needs ATP = primary active transport."},

{t:"Secondary active transport",s:"Chapter 3",y:"mc",q:"Secondary active transport uses which driving force?",o:["A sodium concentration gradient made by the Na-K pump","Sunlight","Osmosis alone","DNA polymerase"],e:"The Na-K pump builds a sodium gradient. Secondary active transport uses that gradient to move other substances low → high."},

{t:"Autolysis vs apoptosis",s:"Chapter 3",y:"mc",q:"Genetically programmed cell death is called…",o:["Apoptosis","Autolysis","Crenation","Metastasis"],e:"Apoptosis = planned death. Autolysis = destruction from the inside after damage."},
{t:"Autolysis vs apoptosis",s:"Chapter 3",y:"case",q:"Analyze the case: A cell is badly injured and destroys itself from the inside out. What is this?",o:["Autolysis","Apoptosis","Mitosis","Exocytosis"],e:"Damage/injury → self-destruction from inside = autolysis."},

{t:"Control of cell division",s:"Chapter 3",y:"sa",q:"Select all the factors that STIMULATE cell division.",o:["M-phase promoting factor","Growth factor","Repressor genes like p53","Worn-out telomeres"],a:[0,1],e:"p53 and worn-out telomeres INHIBIT (stop) cell division."},
{t:"Control of cell division",s:"Chapter 3",y:"tf",q:"Worn-out telomeres inhibit cell division.",a:true,e:"True. Worn-out telomeres and p53 stop cell division."},

{t:"Tumors",s:"Chapter 3",y:"mc",q:"A malignant tumor that spreads to other tissues and causes secondary tumors has…",o:["Metastasized","Stayed in situ","Undergone apoptosis","Become benign"],e:"Metastasis = spreading to other tissues. Benign tumors usually stay in place (in situ)."},
{t:"Tumors",s:"Chapter 3",y:"tf",q:"Benign tumors usually remain in place (in situ).",a:true,e:"True. Malignant tumors invade and can metastasize."},

// ---------- SKIN CANCER (image) ----------
{t:"Skin cancer (image)",s:"Images",y:"case",img:"s2",q:"Analyze the image: A dark brown, uneven mole with irregular borders. Which skin cancer is it?",o:["Melanoma","Basal cell carcinoma","Squamous cell carcinoma","Benign freckle"],e:"Melanoma looks like a dark mole with uneven color and borders. It is the most dangerous one."},
{t:"Skin cancer (image)",s:"Images",y:"case",img:"s0",q:"Analyze the image: A shiny, pearly bump with a small crusty center. Which skin cancer is it?",o:["Basal cell carcinoma","Melanoma","Squamous cell carcinoma","Hematoma"],e:"Basal cell carcinoma often looks like a shiny, pearly bump. It is the most common and rarely spreads."},
{t:"Skin cancer (image)",s:"Images",y:"case",img:"s1",q:"Analyze the image: A red, scaly, crusty patch with a sore in the middle. Which skin cancer is it?",o:["Squamous cell carcinoma","Basal cell carcinoma","Melanoma","Freckle"],e:"Squamous cell carcinoma usually looks like a red, scaly, crusty patch or sore."},
// ---------- LAB ACTIVITY #2 ----------
{t:"Interphase phases",s:"Lab 2",y:"mc",q:"Interphase includes which phases?",o:["G0, G1, S and G2","Prophase, metaphase, anaphase, telophase","G1 and cytokinesis only","S phase and telophase"],e:"Interphase = G0, G1, S, G2. The G stands for gap. Mitosis is PMAT."},
{t:"Interphase phases",s:"Lab 2",y:"mc",q:"G1 is also called the…",o:["Growth phase","Resting phase","Synthesis phase","Division phase"],e:"G1 = growth phase. S = DNA synthesis. G0 = resting."},
{t:"Interphase phases",s:"Lab 2",y:"tf",q:"In interphase, the letter G stands for \"gap.\"",a:true,e:"True. G = gap. G1 is also called the growth phase."},

{t:"G0 resting phase",s:"Lab 2",y:"case",q:"Analyze the case: A cell lacks nutrients and conditions are harsh, so it stops preparing to divide and rests. Which phase is it in?",o:["G0","S phase","Metaphase","G2"],e:"G0 = resting phase. The cell can later go back into G1."},
{t:"G0 resting phase",s:"Lab 2",y:"sa",q:"Select all the cells that do not divide and may stay in G0.",o:["Neurons","Skeletal muscle cells","Skin (epidermis) cells","Cells lining the gut"],a:[0,1],e:"Neurons and skeletal muscle cells stay in G0. Skin and gut lining divide a lot."},

{t:"Mitosis phases",s:"Lab 2",y:"mc",q:"In which phase are the sister chromatids lined up in the center of the cell?",o:["Metaphase","Anaphase","Prophase","Telophase"],e:"Metaphase = Middle. Chromatids line up in the middle."},
{t:"Mitosis phases",s:"Lab 2",y:"mc",q:"In which phase are the sister chromatids pulled apart to opposite sides?",o:["Anaphase","Metaphase","Prophase","Interphase"],e:"Anaphase = Apart. Sister chromatids separate to opposite poles."},
{t:"Mitosis phases",s:"Lab 2",y:"case",q:"Analyze the case: Two new nuclear membranes form and the chromosomes start to uncoil. Which phase is this?",o:["Telophase","Prophase","Metaphase","S phase"],e:"Telophase = Two nuclei form. It is the opposite of prophase."},

{t:"Cytokinesis",s:"Lab 2",y:"mc",q:"Cytokinesis is…",o:["The division of the cytoplasm into two daughter cells","The copying of DNA","The lining up of chromatids","The resting phase"],e:"\"Cyto\" = cell, \"kinesis\" = movement. The cytoplasm splits into two cells."},
{t:"Cytokinesis",s:"Lab 2",y:"tf",q:"Cytokinesis is the step where the cytoplasm divides, making two daughter cells.",a:true,e:"True. It finishes cell division after the nucleus has divided."},

{t:"Centromere, kinetochore, spindle",s:"Lab 2",y:"mc",q:"Which structure holds the two sister chromatids together?",o:["Centromere","Centriole","Kinetochore","Nucleolus"],e:"Centromere = the \"belt\" that holds sister chromatids together."},
{t:"Centromere, kinetochore, spindle",s:"Lab 2",y:"mc",q:"Spindle fibers are made of…",o:["Microtubules","Actin microfilaments","Collagen","Lipids"],e:"Spindle fibers are microtubules. They attach to the kinetochore and pull chromatids apart."},
{t:"Centromere, kinetochore, spindle",s:"Lab 2",y:"sa",q:"Select all the correct matches.",o:["Kinetochore = protein where spindle fibers attach","Centrioles = help organize the spindle for division","Sister chromatids = identical copies of a chromosome","Centromere = makes ribosomes"],a:[0,1,2],e:"The nucleolus makes ribosomes. The centromere holds sister chromatids together."},

{t:"Rough ER and ribosomes",s:"Lab 2",y:"mc",q:"What makes rough ER look \"rough\"?",o:["Ribosomes attached to it","Lysosomes on its surface","Cholesterol crystals","DNA wrapped around it"],e:"Rough ER has ribosomes on it, so it helps make proteins. Smooth ER has no ribosomes."},
{t:"Rough ER and ribosomes",s:"Lab 2",y:"mc",q:"Which organelles make proteins?",o:["Ribosomes","Lysosomes","Peroxisomes","Centrioles"],e:"Ribosomes build proteins. They can float in the cytoplasm or sit on the rough ER."},

{t:"Organelle matching",s:"Lab 2",y:"sa",q:"Select all the correct organelle matches.",o:["Mitochondrion = makes about 95% of the cell's energy","Golgi = packages and ships materials","Lysosome = digests materials","Smooth ER = makes proteins"],a:[0,1,2],e:"Smooth ER makes lipids and carbohydrates. Ribosomes make proteins."},
{t:"Organelle matching",s:"Lab 2",y:"case",q:"Analyze the case: A cell must break down long-chain fatty acids and it makes hydrogen peroxide while doing it. Which organelle is working?",o:["Peroxisome","Lysosome","Golgi apparatus","Nucleolus"],e:"Peroxisomes break down fatty acids (beta oxidation) and make hydrogen peroxide."},

{t:"Osmosis",s:"Lab 2",y:"mc",q:"Osmosis is…",o:["Diffusion of water from high to low (passive)","Movement of glucose using ATP","Taking in materials with vesicles","Moving sodium out of the cell"],e:"Osmosis = water moving from high to low. No energy needed."},
{t:"Osmosis",s:"Lab 2",y:"tf",q:"Osmosis requires ATP.",a:false,e:"False. Osmosis is passive. Water moves on its own from high to low."},

{t:"Channel vs carrier transport",s:"Lab 2",y:"mc",q:"Facilitated diffusion can use two kinds of proteins. Which ones?",o:["Channel proteins and carrier proteins","Enzymes and hormones","Histones and kinetochores","Actin and tubulin"],e:"Facilitated diffusion = through a channel or with a carrier, high → low, no ATP."},
{t:"Channel vs carrier transport",s:"Lab 2",y:"case",q:"Analyze the case: A carrier protein moves a substance from LOW to HIGH concentration. Does it need energy?",o:["Yes, it is active transport","No, it is facilitated diffusion","No, it is osmosis","No, carriers never use energy"],e:"Carrier-mediated transport may or may not need energy. Low → high needs energy (active). High → low does not (facilitated diffusion)."},
{t:"Channel vs carrier transport",s:"Lab 2",y:"tf",q:"Carrier-mediated transport always requires energy.",a:false,e:"False. It depends on direction. High → low = no energy. Low → high = energy."},

// ---------- LAB ACTIVITY #3 ----------
{t:"Epithelial tissue traits",s:"Lab 3",y:"sa",q:"Select all the characteristics of epithelial tissue.",o:["Avascular (no blood supply of its own)","Innervated (has nerve endings)","High mitotic index (cells divide a lot)","Cells tightly packed together","Lots of blood vessels inside"],a:[0,1,2,3],e:"Epithelium has no blood vessels of its own. It gets nutrients from the tissue below."},
{t:"Epithelial tissue traits",s:"Lab 3",y:"tf",q:"Epithelial tissue is avascular, meaning it lacks its own blood supply.",a:true,e:"True. Avascular = no blood vessels. It is still innervated (has nerves)."},

{t:"Types of epithelium",s:"Lab 3",y:"mc",q:"Which epithelium lines blood vessels and is also called endothelium?",o:["Simple squamous","Simple cuboidal","Stratified squamous","Dense irregular"],e:"Simple squamous = one layer of flat cells. Thin, so things pass through easily."},
{t:"Types of epithelium",s:"Lab 3",y:"mc",q:"Which epithelium forms the outer layer of the skin (epidermis) and has many layers?",o:["Stratified squamous","Simple squamous","Simple cuboidal","Areolar"],e:"Stratified = many layers. Many layers protect against scrapes."},
{t:"Types of epithelium",s:"Lab 3",y:"case",q:"Analyze the case: Under the microscope you see ONE layer of cube-shaped cells. What tissue is it?",o:["Simple cuboidal","Simple squamous","Stratified squamous","Adipose"],e:"Simple = one layer. Cuboidal = cube-shaped. It is found in glands and ducts (like sweat glands)."},

{t:"Areolar tissue",s:"Lab 3",y:"mc",q:"Which is the most abundant cell type in areolar tissue?",o:["Fibroblasts","Adipocytes","Melanocytes","Keratinocytes"],e:"Fibroblasts are the main cells in areolar tissue. They maintain the extracellular matrix (ECM)."},
{t:"Areolar tissue",s:"Lab 3",y:"mc",q:"Areolar tissue is found in which layer of the dermis?",o:["Papillary (surface) layer","Reticular (deep) layer","Stratum corneum","Stratum basale"],e:"Areolar = papillary (top) layer of the dermis. Dense irregular = reticular (deep) layer."},
{t:"Areolar tissue",s:"Lab 3",y:"tf",q:"Areolar tissue is the most abundant and widely distributed tissue in the body.",a:true,e:"True. It has cells scattered in a large nonliving matrix (ECM)."},

{t:"Connective tissue parts",s:"Lab 3",y:"sa",q:"Select all the structures you can find in the matrix of areolar tissue.",o:["Collagen fibers","Elastic fibers","Ground substance","Keratin layers"],a:[0,1,2],e:"The matrix has collagen fibers, elastic fibers and ground substance. Keratin is in the epidermis."},
{t:"Connective tissue parts",s:"Lab 3",y:"mc",q:"Dense irregular connective tissue is found in the…",o:["Deep (reticular) layer of the dermis","Stratum corneum","Lining of blood vessels","Papillary layer only"],e:"Dense irregular = deep dermis. Its fibers go in many directions to resist pulling from all sides."},

{t:"Adipose tissue",s:"Lab 3",y:"mc",q:"Adipocytes store lipids in the form of…",o:["Triglycerides","Glycogen","Proteins","Cholesterol crystals"],e:"Adipocytes (fat cells) store triglycerides."},
{t:"Adipose tissue",s:"Lab 3",y:"sa",q:"Select all the functions of adipose tissue.",o:["Protection","Padding","Insulation","Energy storage","Makes melanin"],a:[0,1,2,3],e:"Melanin is made by melanocytes in the epidermis. Adipose is mostly in the hypodermis."},

{t:"Skin functions and layers",s:"Lab 3",y:"mc",q:"What are the two basic layers of the skin?",o:["Epidermis and dermis","Dermis and hypodermis","Papillary and reticular","Basale and corneum"],e:"Skin = epidermis (top) + dermis (below). The hypodermis is under the skin."},
{t:"Skin functions and layers",s:"Lab 3",y:"mc",q:"The hypodermis is also called…",o:["Subcutaneous layer (superficial fascia)","Reticular layer","Stratum lucidum","Deep fascia"],e:"Hypodermis = subcutaneous layer = superficial fascia. It separates the skin from the deep fascia."},

{t:"Epidermal strata",s:"Lab 3",y:"mc",q:"Which is the deepest layer of the epidermis?",o:["Stratum basale","Stratum corneum","Stratum lucidum","Stratum granulosum"],e:"From deep to surface: basale, spinosum, granulosum, lucidum, corneum. \"Come, Let's Get Sun Burned\" (top to bottom)."},
{t:"Epidermal strata",s:"Lab 3",y:"mc",q:"Which is the outermost (surface) layer of the epidermis?",o:["Stratum corneum","Stratum basale","Stratum spinosum","Stratum granulosum"],e:"Stratum corneum = the top layer of dead, flat cells full of keratin."},
{t:"Epidermal strata",s:"Lab 3",y:"sa",q:"Select all the layers (strata) of the epidermis.",o:["Stratum basale","Stratum spinosum","Stratum granulosum","Stratum lucidum","Stratum corneum","Stratum reticulare"],a:[0,1,2,3,4],e:"Five strata. Reticular is a layer of the DERMIS, not the epidermis."},

{t:"Thick vs thin skin",s:"Lab 3",y:"mc",q:"Thick skin has 5 strata. Where is it found?",o:["Palms of the hands and soles of the feet","Scalp and armpits","Face and neck","Back and chest"],e:"Thick skin (5 strata) = palms and soles only. It has the extra stratum lucidum."},
{t:"Thick vs thin skin",s:"Lab 3",y:"case",q:"Analyze the case: A skin sample from the scalp shows only 4 strata. Which layer is missing?",o:["Stratum lucidum","Stratum basale","Stratum corneum","Stratum spinosum"],e:"Thin skin (4 strata) has no stratum lucidum. Only thick skin (palms and soles) has it."},
{t:"Thick vs thin skin",s:"Lab 3",y:"tf",q:"Thin skin has 4 strata and is found in places like the scalp and axillae.",a:true,e:"True. Thick skin = 5 strata, only palms and soles."},

{t:"Skin cell types",s:"Lab 3",y:"mc",q:"Which cells make melanin (skin color)?",o:["Melanocytes","Keratinocytes","Langerhans cells","Merkel cells"],e:"Melanocytes make melanin, which protects against UV light."},
{t:"Skin cell types",s:"Lab 3",y:"mc",q:"Which are the most common cells of the epidermis and make keratin?",o:["Keratinocytes","Melanocytes","Fibroblasts","Adipocytes"],e:"Keratinocytes make keratin, a tough protein that protects the skin."},
{t:"Skin cell types",s:"Lab 3",y:"sa",q:"Select all the correct matches.",o:["Merkel cells = sense light touch","Langerhans cells = immune defense","Basal cells = divide to make new skin cells","Melanocytes = store fat"],a:[0,1,2],e:"Melanocytes make melanin. Adipocytes store fat."},

{t:"Dermis layers",s:"Lab 3",y:"mc",q:"What are the two layers of the dermis?",o:["Papillary and reticular","Basale and corneum","Epidermis and hypodermis","Spinosum and lucidum"],e:"Dermis = papillary (top, areolar tissue) + reticular (deep, dense irregular tissue)."},
{t:"Dermis layers",s:"Lab 3",y:"mc",q:"The bumps of the dermis that push up into the epidermis are called…",o:["Dermal papillae","Epidermal ridges","Arrector pili","Hair follicles"],e:"Dermal papillae push up. Epidermal ridges push down between them. Together they make fingerprints and hold the layers together."},

{t:"Skin receptors",s:"Lab 3",y:"mc",q:"Which receptor senses light touch and is also called a tactile corpuscle?",o:["Meissner corpuscle","Pacinian corpuscle","Sebaceous gland","Arrector pili"],e:"Meissner = light touch (near the surface). Pacinian (lamellar) = deep pressure and vibration."},
{t:"Skin receptors",s:"Lab 3",y:"case",q:"Analyze the case: A phone vibrates in a pocket and the person feels deep pressure and vibration. Which receptor detects it?",o:["Pacinian (lamellar) corpuscle","Meissner (tactile) corpuscle","Melanocyte","Eccrine gland"],e:"Pacinian corpuscles are deep and look like onion layers (lamellar). They sense pressure and vibration."},

{t:"Arrector pili and hair",s:"Lab 3",y:"mc",q:"What happens when the arrector pili muscle contracts?",o:["Hair stands up and goosebumps form (piloerection)","Sweat is released","Oil is released only","The hair falls out"],e:"Arrector pili pulls the hair upright = goosebumps."},
{t:"Arrector pili and hair",s:"Lab 3",y:"sa",q:"Select all the parts of a hair.",o:["Shaft","Follicle","Root","Papilla","Stratum lucidum"],a:[0,1,2,3],e:"Hair: shaft (above skin), root (below skin), follicle (the tube around it), papilla (the base that feeds it)."},
{t:"Arrector pili and hair",s:"Lab 3",y:"mc",q:"The part of the hair you can see above the skin is the…",o:["Shaft","Root","Papilla","Follicle"],e:"Shaft = above the skin. Root = below the skin."},

{t:"Skin glands",s:"Lab 3",y:"mc",q:"Which glands release oil (sebum) into the hair follicle?",o:["Sebaceous glands","Eccrine sweat glands","Apocrine sweat glands","Mammary glands"],e:"Sebaceous = oil glands. They keep skin and hair soft."},
{t:"Skin glands",s:"Lab 3",y:"case",q:"Analyze the case: On a hot day, clear watery sweat covers the whole body to cool it down. Which glands are working?",o:["Eccrine sweat glands","Apocrine sweat glands","Sebaceous glands","Ceruminous glands"],e:"Eccrine = all over the body, watery sweat, cooling. Apocrine = armpits and groin, thicker sweat."},
{t:"Skin glands",s:"Lab 3",y:"mc",q:"Apocrine sweat glands are mainly found in the…",o:["Armpits (axillae) and groin","Palms only","Forehead only","Lips"],e:"Apocrine glands are in armpits and groin and open into hair follicles."},

{t:"Skin cancer facts",s:"Lab 3",y:"mc",q:"Which skin cancer is the MOST common and rarely metastasizes?",o:["Basal cell carcinoma","Melanoma","Squamous cell carcinoma","Lymphoma"],e:"Basal cell = most common, rarely spreads. Melanoma = least common but most deadly."},
{t:"Skin cancer facts",s:"Lab 3",y:"mc",q:"Which skin cancer is the least common but the most fatal?",o:["Melanoma","Basal cell carcinoma","Squamous cell carcinoma","Freckle"],e:"Melanoma is the deadliest. Check moles with the ABCDE rule."},
{t:"Skin cancer facts",s:"Lab 3",y:"case",q:"Analyze the case: A firm, red nodule or a flat scaly lesion appears on sun-exposed skin. Which skin cancer does it look like?",o:["Squamous cell carcinoma","Basal cell carcinoma","Melanoma","Benign mole"],e:"Squamous cell = firm red nodule or flat scaly lesion. Basal cell = pearly bump or sore that heals and comes back."},

{t:"ABCDE rule",s:"Lab 3",y:"mc",q:"In the ABCDE rule for melanoma, what does the E stand for?",o:["Evolution (changing over time)","Elevation only","Edema","Epidermis"],e:"A = Asymmetry, B = Border, C = Color, D = Diameter, E = Evolution."},
{t:"ABCDE rule",s:"Lab 3",y:"sa",q:"Select all the letters of the ABCDE rule with their correct meaning.",o:["A = Asymmetry","B = Border","C = Color","D = Diameter","E = Epithelium"],a:[0,1,2,3],e:"E = Evolution, meaning the mole changes in size, shape or color."},
{t:"ABCDE rule",s:"Lab 3",y:"case",q:"Analyze the case: A mole is uneven (one half doesn't match the other), has a jagged edge and several colors. What should you suspect?",o:["Melanoma (use the ABCDE rule)","A normal freckle","Basal cell carcinoma for sure","A sebaceous gland"],e:"Asymmetry, irregular Border and many Colors are warning signs of melanoma."}

const KEY = "koran-unit1-review-v1";
const PER_DAY = 20;

function load(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return {topics:{},days:{},used:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
const TYPE = {mc:"Multiple choice",tf:"True / False",case:"Analyze the case",sa:"Select all"};

let S = load();
S.topics = S.topics||{}; S.days = S.days||{}; S.used = S.used||{};
const TOPICS = {};
BANK.forEach((q,i)=>{ (TOPICS[q.t]=TOPICS[q.t]||[]).push(i); });

function pickVariant(t){
  const vs = TOPICS[t], last = (S.topics[t]||{}).lastQ;
  let pool = vs.filter(i=>i!==last && !S.used[i]);
  if(!pool.length) pool = vs.filter(i=>i!==last);
  if(!pool.length) pool = vs;
  return shuffle(pool)[0];
}
function buildDay(){
  const names = Object.keys(TOPICS), chosen = [];
  const review = shuffle(names.filter(t=>S.topics[t] && S.topics[t].review));
  const fresh = shuffle(names.filter(t=>!S.topics[t]));
  const old = names.filter(t=>S.topics[t] && !S.topics[t].review)
    .sort((a,b)=>{ const ma=S.topics[a].firstTry/S.topics[a].seen, mb=S.topics[b].firstTry/S.topics[b].seen;
      return (S.topics[a].lastDate||"").localeCompare(S.topics[b].lastDate||"") || ma-mb; });
  for(const t of [...review,...fresh,...old]){ if(chosen.length>=PER_DAY) break; if(!chosen.includes(t)) chosen.push(t); }
  const ids = shuffle(chosen.map(pickVariant));
  const orders = ids.map(i=>{ const q=BANK[i]; if(q.y==="tf") return [0,1]; return shuffle(q.o.map((_,k)=>k)); });
  return {ids, orders, i:0, ans:[], done:false, reviewCount: Math.min(review.length,PER_DAY)};
}

const D = today();
if(!S.days[D]) { S.days[D] = buildDay(); save(); }
const day = S.days[D];
if(!day.done && day.ids.length < PER_DAY){
  const have = new Set(day.ids.map(i=>BANK[i].t));
  const extra = buildDay();
  for(let k=0;k<extra.ids.length && day.ids.length<PER_DAY;k++){
    if(!have.has(BANK[extra.ids[k]].t)){ day.ids.push(extra.ids[k]); day.orders.push(extra.orders[k]); have.add(BANK[extra.ids[k]].t); }
  }
  save();
}
let cur = {tries:0, picks:[], wrongPicks:[], finished:false};

function points(){ return day.ans.reduce((s,a)=>s+a.pts,0); }
function fmt(n){ return Number.isInteger(n)? String(n) : n.toFixed(1); }

function renderBar(){
  const segs = day.ids.map((_,k)=>{ const a=day.ans[k]; if(a) return `<span class="p${a.pts===1?1:a.pts===0?0:5}"></span>`; return `<span class="${k===day.i&&!day.done?'now':''}"></span>`; }).join("");
  const left = day.done ? "Done for today" : `Question ${Math.min(day.i+1,PER_DAY)} of ${day.ids.length}`;
  const label = day.done ? "Final score" : "Score";
  document.getElementById("bar").innerHTML =
    `<div class="scorecard" role="status" aria-live="polite"><div><div class="qcount">${left}</div></div>
     <div class="score">${label} <b>${fmt(points())}</b> / ${day.ids.length}</div></div>
     <div class="track" aria-hidden="true">${segs}</div>`;
}

function correctSet(q){ if(q.y==="tf") return [q.a?0:1]; if(q.y==="sa") return q.a.slice().sort(); return [0]; }
function optText(q,k){ return q.y==="tf" ? (k===0?"True":"False") : q.o[k]; }

function renderQuestion(){
  const qi = day.ids[day.i], q = BANK[qi], order = day.orders[day.i];
  const img = q.img ? `<div class="figure"><img src="${IMG[q.img]}" alt="Image for this question"></div>` : "";
  const hint = q.y==="sa" ? `<p class="hint">Tap every correct answer, then check.</p>` : "";
  const opts = order.map(k=>`<button type="button" class="opt" data-k="${k}">${q.y==="sa"?'<span class="box"></span>':''}<span>${esc(optText(q,k))}</span></button>`).join("");
  document.getElementById("main").innerHTML =
   `<article class="card">
      <div class="meta"><span class="tag">${esc(q.s)}</span><span class="tag">${TYPE[q.y]}</span></div>
      <p class="q">${esc(q.q)}</p>${img}${hint}
      <div class="opts ${q.y==="tf"?"tf":""}" id="opts">${opts}</div>
      ${q.y==="sa"?'<button class="btn" id="check" type="button" disabled>Check answer</button>':''}
      <div id="fb"></div>
      <div id="next"></div>
    </article>`;
  cur = {tries:0, picks:[], wrongPicks:[], finished:false};
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>onPick(q,qi,+b.dataset.k,b)));
  if(q.y==="sa") document.getElementById("check").addEventListener("click",()=>onCheckSA(q,qi));
  renderBar();
}

function onPick(q,qi,k,btn){
  if(cur.finished) return;
  if(q.y==="sa"){
    btn.classList.toggle("sel");
    btn.querySelector(".box").textContent = btn.classList.contains("sel") ? "✓" : "";
    cur.picks = [...document.querySelectorAll(".opt.sel")].map(b=>+b.dataset.k);
    document.getElementById("check").disabled = cur.picks.length===0;
    return;
  }
  const right = correctSet(q)[0]===k;
  if(right){ btn.classList.add("right"); finish(q,qi, cur.tries===0?1:0.5, [k]); return; }
  btn.classList.add("wrong"); btn.disabled = true; cur.wrongPicks.push(k);
  if(q.y==="tf" || cur.tries===1){ finish(q,qi,0,[k]); return; }
  cur.tries = 1;
  feedback("try","Incorrect, one more try","");
}

function onCheckSA(q,qi){
  const pick = cur.picks.slice().sort(), ok = correctSet(q);
  const right = pick.length===ok.length && pick.every((v,i)=>v===ok[i]);
  if(right){ finish(q,qi, cur.tries===0?1:0.5, pick); return; }
  if(cur.tries===0){ cur.tries=1; feedback("try","Incorrect, one more try","Some choices are missing or extra. Look again."); return; }
  finish(q,qi,0,pick);
}

function feedback(kind,title,body){
  document.getElementById("fb").innerHTML = `<div class="fb ${kind}" role="alert"><h3>${title}</h3>${body?`<p>${body}</p>`:""}</div>`;
}

function finish(q,qi,pts,picks){
  cur.finished = true;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; });
  const ok = correctSet(q);
  const answerText = ok.map(k=>optText(q,k)).join(" · ");
  if(pts===1) feedback("ok","Correct! +1", esc(q.e));
  else if(pts===0.5) feedback("ok","Correct on the second try! +½", esc(q.e));
  else {
    document.querySelectorAll(".opt").forEach(b=>{ if(ok.includes(+b.dataset.k)) b.classList.add("right"); });
    feedback("bad","Incorrect", `<span class="ans">Correct answer: ${esc(answerText)}</span></p><p>${esc(q.e)}`);
  }
  const chk = document.getElementById("check"); if(chk) chk.remove();
  // record
  day.ans[day.i] = {qi, t:q.t, pts, tries:cur.tries+1, picks};
  S.used[qi] = true;
  const tp = S.topics[q.t] || {seen:0, firstTry:0};
  tp.seen++; if(pts===1) tp.firstTry++;
  tp.review = pts!==1; tp.lastQ = qi; tp.lastDate = D;
  S.topics[q.t] = tp;
  save(); renderBar();
  const last = day.i >= day.ids.length-1;
  document.getElementById("next").innerHTML = `<button class="btn" id="go" type="button">${last?"See final score":"Next question"}</button>`;
  const go = document.getElementById("go"); go.focus({preventScroll:true});
  go.addEventListener("click",()=>{ day.i++; if(day.i>=day.ids.length){ day.done=true; } save(); route(); window.scrollTo({top:0}); });
}

function renderFinal(){
  const p = points();
  const r = p/day.ids.length; const msg = r>=.9 ? "Excellent work!" : r>=.7 ? "Great job. Keep it up!" : r>=.5 ? "Good effort. Tomorrow you'll see the tricky ones again." : "Keep going. Tomorrow you'll practice the ones you missed.";
  const rows = day.ans.map(a=>`<li><span>${esc(a.t)}</span><span class="pt p${a.pts===1?1:a.pts===0?0:5}">${a.pts===1?"+1":a.pts===0?"0":"+½"}</span></li>`).join("");
  const again = day.ans.filter(a=>a.pts!==1).length;
  document.getElementById("main").innerHTML =
   `<article class="card final">
      <p class="sub" style="margin:0">Final score</p>
      <p class="big">${fmt(p)}<small> / ${day.ids.length}</small></p>
      <p>${msg}</p>
      <p class="sub">${again ? `${again} topic${again>1?"s":""} will come back tomorrow, asked a different way.` : "Perfect day. Tomorrow brings 20 new questions."}</p>
      <ul class="list">${rows}</ul>
    </article>`;
  renderBar();
}

function streak(){
  let n=0; const d=new Date();
  if(!(S.days[today()]||{}).done) d.setDate(d.getDate()-1);
  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(S.days[k] && S.days[k].done){ n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function renderReport(){
  const done = Object.entries(S.days).filter(([,d])=>d.done).sort((a,b)=>b[0].localeCompare(a[0]));
  const avg = done.length ? done.reduce((s,[,d])=>s+100*d.ans.reduce((x,a)=>x+a.pts,0)/d.ids.length,0)/done.length : 0;
  const allTopics = Object.keys(TOPICS);
  const seen = allTopics.filter(t=>S.topics[t]);
  const mastery = seen.map(t=>({t, pct: Math.round(100*S.topics[t].firstTry/S.topics[t].seen), n:S.topics[t].seen})).sort((a,b)=>a.pct-b.pct);
  const review = allTopics.filter(t=>S.topics[t] && S.topics[t].review);
  const hist = Object.entries(S.days).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,d])=>{
    const sc = d.ans.reduce((x,a)=>x+(a?a.pts:0),0);
    const rows = d.ans.filter(Boolean).map(a=>{ const q=BANK[a.qi]; return `<tr><td>${esc(q.q)}<br><span class="empty">${a.tries===1?"1st try":"2nd try"} · ${esc(a.t)}</span></td><td class="pt p${a.pts===1?1:a.pts===0?0:5}">${a.pts===1?"1":a.pts===0?"0":"½"}</td></tr>`; }).join("");
    return `<details><summary>${k} — ${fmt(sc)} / ${d.ids.length}${d.done?"":" (in progress)"}</summary><table class="tbl">${rows||'<tr><td class="empty">No answers yet.</td></tr>'}</table></details>`;
  }).join("");
  document.getElementById("report").innerHTML =
   `<h2>Progress report</h2>
    <div class="stats">
      <div class="stat"><b>${done.length}</b><span>Days completed</span></div>
      <div class="stat"><b>${Math.round(avg)}%</b><span>Average score</span></div>
      <div class="stat"><b>${streak()}</b><span>Days in a row</span></div>
      <div class="stat"><b>${seen.length}/${allTopics.length}</b><span>Topics practiced</span></div>
    </div>
    <h3>To review tomorrow</h3>
    <p>${review.length? review.map(esc).join(", ") : '<span class="empty">Nothing pending.</span>'}</p>
    <h3>Mastery by topic (correct on 1st try)</h3>
    ${mastery.length ? `<table class="tbl">${mastery.map(m=>`<tr><td>${esc(m.t)}<div class="meter"><i style="width:${m.pct}%"></i></div></td><td>${m.pct}%</td></tr>`).join("")}</table>` : '<p class="empty">Answer a few questions to see mastery.</p>'}
    <h3>Answer history</h3>
    ${hist || '<p class="empty">No history yet.</p>'}`;
}
document.getElementById("toggleReport").addEventListener("click",()=>{
  const r=document.getElementById("report"), b=document.getElementById("toggleReport");
  if(r.hidden){ renderReport(); r.hidden=false; b.textContent="Hide progress report"; r.scrollIntoView({behavior:"smooth"}); }
  else { r.hidden=true; b.textContent="Progress report"; }
});

function route(){ while(!day.done && day.ans[day.i]) day.i++; if(day.i>=day.ids.length && !day.done){ day.done=true; save(); } if(day.done) renderFinal(); else renderQuestion(); }
route();
</script>
</body>
</html>
